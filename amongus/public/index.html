<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Among Us · class edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="top" class="hud top hidden">
  <div class="bar"><i id="prog"></i><span>TOTAL TASKS COMPLETED</span></div>
  <div id="tasks" class="tasks"></div>
</div>
<div id="tr" class="hud tr">
  <button id="bChat" class="sq hidden" title="Chat (C)">💬<b id="chatDot" class="dot hidden"></b></button>
  <button id="bMap" class="sq hidden" title="Map (M)">🗺️</button>
</div>
<div id="alarm" class="alarm hidden"></div>
<div id="lobbyBar" class="lobbybar hidden">
  <div class="lbt"><b id="lbTitle">Lobby</b><span id="lbSub"></span></div>
  <div id="colors" class="colors"></div>
  <div class="lbbtns"><button id="bSet" class="btn2">⚙️ Game settings</button><button id="bStart" class="big start hidden">START</button></div>
  <small id="lbHint"></small>
</div>
<div id="acts" class="acts hidden">
  <button id="aSab" class="act red hidden"><i>☢️</i><span>SABOTAGE</span></button>
  <button id="aVent" class="act red hidden"><i>🕳️</i><span>VENT</span><em>F</em></button>
  <button id="aKill" class="act red hidden"><i>🔪</i><span>KILL</span><em>A</em><b id="killCd"></b></button>
  <button id="aReport" class="act"><i>📣</i><span>REPORT</span><em>R</em></button>
  <button id="aUse" class="act"><i>✋</i><span>USE</span><em>E</em></button>
</div>
<div id="sabMenu" class="sabmenu hidden"><button data-sab="reactor">☢️ Reactor meltdown</button><button data-sab="lights">💡 Lights</button></div>

<div id="chat" class="chat hidden">
  <div class="chead"><b id="chatTitle">Chat</b><button id="chatX" class="x">✕</button></div>
  <div id="chatList" class="clist"></div>
  <form id="chatForm" class="cform"><input id="chatIn" maxlength="160" autocomplete="off" placeholder="Type a message…"><button>➤</button></form>
</div>

<div id="mapOv" class="ov hidden"><div class="mapbox"><canvas id="mapCv" width="1000" height="550"></canvas><button id="mapX" class="x">✕</button></div></div>
<div id="taskOv" class="ov hidden"><div class="taskbox"><div class="thead"><b id="taskTitle"></b><button id="taskX" class="x">✕</button></div><div id="taskBody"></div></div></div>
<div id="meet" class="ov meet hidden"><div class="tablet" id="tablet">
  <div class="mhead"><b>Who is the Impostor?</b><button id="mChatBtn" class="mchatbtn" title="Chat">💬<b id="mChatDot" class="dot hidden"></b></button></div>
  <div id="mGrid" class="mgrid"></div>
  <div class="mfoot"><div class="skipwrap"><button id="mSkip" class="skip">SKIP VOTE</button><div id="mSkipVotes" class="vdots"></div></div><span id="mInfo"></span><span id="mTimer" class="mtimer"></span></div>
  <div id="mChatPanel" class="mchat hidden"><div class="mchead"><b>💬 Meeting chat</b><button id="mChatX" class="x">✕</button></div><div id="mChat" class="clist bubbles"></div><form id="mForm" class="cform"><input id="mIn" maxlength="160" autocomplete="off" placeholder="Type here…"><button>➤</button></form></div>
</div></div>
<div id="setOv" class="ov hidden"><div class="setbox"><div class="thead"><b id="setTitle">Game settings</b><button id="setX" class="x">✕</button></div><div id="setBody" class="setbody"></div></div></div>
<div id="splash" class="ov splash hidden"></div>
<div id="msg" class="toast hidden"></div>
<div id="fatal" class="ov fatal hidden"><div><h1>🚀</h1><p id="fatalTxt"></p></div></div>
<div id="stick" class="stick hidden"><i></i></div>

<script src="/socket.io/socket.io.js"></script>
<script src="map.js"></script>
<script src="sprite.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
</body>
</html>
